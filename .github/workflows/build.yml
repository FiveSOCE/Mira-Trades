name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraTrades-0.1.0
          path: build/libs/MiraTrades-0.1.0.jar
          if-no-files-found: error
      - name: Publish v0.1.0 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 \
              build/libs/MiraTrades-0.1.0.jar \
              --target "${{ github.sha }}" \
              --title "MiraTrades v0.1.0" \
              --notes "Initial MiraTrades release with secure escrowed item trading, Vault money offers through a dedicated GUI, dual confirmation with countdown/reset-on-change, disconnect/cancel protection, and persistent player trade-request toggles."
          fi
